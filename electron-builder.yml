appId: com.gamestock.app
productName: GameStock
directories:
  output: release
files:
  - dist/**
  - node_modules/**
  - package.json
win:
  icon: build/icon-win.png
  target:
    - nsis
    - portable
linux:
  category: Game
  icon: build
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
